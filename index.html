<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Arab tili">

<title>Arab tili — mening ilovam</title>
<style>
@font-face{font-family:'Amiri';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/amiri-arabic-400-normal.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/amiri-arabic-700-normal.woff2) format('woff2')}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
:root{--bg:#17110d;--card:#241a14;--card2:#2e2219;--line:#3b2d22;--tx:#f3e9dc;--mut:#a8977f;--gold:#d9b36c;--ok:#6fbf8b;--bad:#e07a6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 0}
#app{max-width:520px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.ar{font-family:'Amiri','Geeza Pro','Traditional Arabic',serif;direction:rtl}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:15px;margin:22px 0 10px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
p.m{color:var(--mut);margin:2px 0 12px;font-size:14px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
button,.btn{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button:active{transform:scale(.98)}
.pri{background:var(--gold);color:#2a1d0c;border-color:var(--gold);font-weight:700}
.full{width:100%}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:rtl}
.lt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 2px 7px;text-align:center;cursor:pointer;direction:ltr}
.lt.k{border-color:var(--ok);background:#1f2a22}
.lt .ar{font-size:38px;line-height:1.25;display:block;direction:rtl}
.lt small{font-size:11px;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#120d0a;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav div{max-width:520px;width:100%;display:flex}
.nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 2px 9px;font-size:11px;color:var(--mut)}
.nav button b{display:block;font-size:20px;font-weight:400;margin-bottom:1px}
.nav button.on{color:var(--gold)}
.big{font-size:64px;line-height:1.4;text-align:center}
.ctr{text-align:center}
.tag{display:inline-block;font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.dot.a{background:var(--gold);border-color:var(--gold)}
.task{display:flex;align-items:center;gap:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.chk.d{background:var(--ok);border-color:var(--ok);color:#10281a}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.opt{display:block;width:100%;margin-bottom:8px;text-align:left;font-size:16px}
.opt.ar{text-align:center;font-size:28px}
.opt.ok{background:#1f2a22;border-color:var(--ok)}
.opt.no{background:#2e1c19;border-color:var(--bad)}
input[type=text]{width:100%;font:inherit;font-size:17px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:rtl;margin:10px 0}
.forms div{background:var(--card2);border-radius:10px;text-align:center;padding:6px 0;direction:ltr}
.forms .ar{font-size:30px;display:block;line-height:1.5}
.forms small{font-size:10px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;max-width:88%;z-index:30;display:none;text-align:center}
.wl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border:0}
.wl .ar{font-size:26px;min-width:84px;text-align:right}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{min-height:56px;font-size:15px}
.mt button.ar{font-size:26px}
.mt button.sel{border-color:var(--gold)}
.mt button.dn{opacity:.3}
</style>

const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dk(d)};

function streak(){let n=0,d=new Date();if(!isAct(dk(d)))d.setDate(d.getDate()-1);while(isAct(dk(d))){n++;d.setDate(d.getDate()-1)}return n}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];

function speak(t,rate){
  try{
    const ss=window.speechSynthesis;if(!ss){toast('Bu brauzerda ovoz yo\'q');return}
    const v=ss.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('ar'));

    ss.cancel();ss.speak(u);
    if(!v&&!S.vflag){S.vflag=1;save();toast('Arabcha ovoz topilmasa: iPhone Sozlamalar → Maxsus imkoniyatlar → Aytib berish (Spoken Content) → Ovozlar → Arabcha yuklab oling.')}
  }catch(e){}
}

function rate(r){
  const w=L.q.shift(),c=S.cards[w.id]||{box:0,due:dk()};
  if(r==0){c.box=0;c.due=dk();L.q.push(w)}
  else if(r==1){c.box=Math.max(1,c.box);c.due=addDays(1)}
  else{c.box=Math.min(5,c.box+1);c.due=addDays(IV[c.box])}
  S.cards[w.id]=c;day().c++;save();L.flip=false;
}

/* ---------- Mashq ---------- */
const norm=s=>s.replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
function startP(mode){
  P={mode,n:0,score:0,total:10,fb:null,done:false};
  if(mode=='match')newMatch();else nextQ();
}
function nextQ(){
  const all=allWords(),w=pick(all);
  P.w=w;P.fb=null;
  P.opts=shuffle([w,...shuffle(all.filter(x=>x.id!=w.id)).slice(0,3)]);
}
function newMatch(){
  const ws=shuffle(allWords()).slice(0,5);
  M={ws,a:shuffle(ws.map(w=>w.id)),u:shuffle(ws.map(w=>w.id)),sa:null,su:null,dn:[]};
}
function finishP(){if(P.done)return;P.done=true;day().p++;save()}
function vPractice(){
  if(!P){return `<h1>Mashq</h1><p class="m">Har bir mashq tugatilsa, bugungi vazifa bajariladi.</p>
  <div class="card"><b>Test</b><p class="m">Arabcha so'z ko'rsatiladi, o'zbekcha tarjimasini toping.</p><button class="pri full" data-a="pstart" data-m="test">Boshlash</button></div>
  <div class="card"><b>Eshitib topish</b><p class="m">So'zni eshitasiz, arabcha yozuvini tanlaysiz.</p><button class="pri full" data-a="pstart" data-m="listen">Boshlash</button></div>
  <div class="card"><b>Yozish</b><p class="m">O'zbekcha so'z beriladi, arabchasini yozasiz (harakatlar shart emas).</p><button class="pri full" data-a="pstart" data-m="write">Boshlash</button></div>
  <div class="card"><b>Juftlarni topish</b><p class="m">5 ta arabcha so'zni o'zbekcha tarjimasi bilan juftlang.</p><button class="pri full" data-a="pstart" data-m="match">Boshlash</button></div>`}
  const head=`<div class="row"><button data-a="pend">← Chiqish</button><span class="sp"></span><span class="tag">${P.mode=='match'?'Juftlar':P.n+'/'+P.total}</span></div>`;
  if(P.mode=='match'){
    const f=id=>ws=>0;const by=id=>M.ws.find(w=>w.id==id);
    const all=M.dn.length==5;if(all)finishP();
    return head+`<h1 style="margin-top:14px">Juftlarni toping</h1>
    ${all?`<div class="card ctr"><div class="big">🎉</div><b>Hammasi to'g'ri!</b><br><br><button class="pri" data-a="pstart" data-m="match">Yana</button></div>`:''}
    <div class="mt"><div>${M.a.map(id=>`<button class="ar full ${M.sa==id?'sel':''} ${M.dn.includes(id)?'dn':''}" style="margin-bottom:8px" data-a="ma" data-id="${id}">${by(id).ar}</button>`).join('')}</div>
    <div>${M.u.map(id=>`<button class="full ${M.su==id?'sel':''} ${M.dn.includes(id)?'dn':''}" style="margin-bottom:8px;min-height:56px" data-a="mu" data-id="${id}">${esc(by(id).uz)}</button>`).join('')}</div></div>`;
  }
  if(P.n>=P.total){finishP();return head+`<div class="ctr" style="padding-top:40px"><div class="big">${P.score>=8?'🌟':'👍'}</div><h1>${P.score} / ${P.total}</h1><p class="m">Mashq tugadi. Bugungi vazifa bajarildi.</p><button class="pri" data-a="pstart" data-m="${P.mode}">Yana bir marta</button></div>`}
  const w=P.w,fb=P.fb;
  let body='';
  if(P.mode=='test'){
    body=`<div class="card ctr"><div class="big ar">${w.ar}</div><button data-a="say" data-t="${esc(w.ar)}">🔊</button></div>`+
      P.opts.map((o,i)=>`<button class="opt ${fb?(o.id==w.id?'ok':(fb.i==i?'no':'')):''}" data-a="ans" data-i="${i}">${esc(o.uz)}</button>`).join('');
  }else if(P.mode=='listen'){
    body=`<div class="card ctr"><p class="m">Eshiting va to'g'ri yozuvni tanlang</p><button class="pri" data-a="say" data-t="${esc(w.ar)}">🔊 Eshitish</button></div>`+
      P.opts.map((o,i)=>`<button class="opt ar ${fb?(o.id==w.id?'ok':(fb.i==i?'no':'')):''}" data-a="ans" data-i="${i}">${o.ar}</button>`).join('')+
      (fb?`<p class="m ctr">${esc(w.tr)} — ${esc(w.uz)}</p>`:'');
  }else{
    body=`<div class="card ctr"><p class="m">Arabchasini yozing:</p><h1>${esc(w.uz)}</h1><p class="m">Ishora: ${esc(w.tr)}</p></div>
    <input type="text" id="wi" class="ar" dir="rtl" placeholder="اكتب هنا" ${fb?'disabled':''} autocomplete="off" autocapitalize="off">
    ${fb?`<div class="card ctr" style="border-color:${fb.ok?'var(--ok)':'var(--bad)'}"><div class="big ar" style="font-size:44px">${w.ar}</div>${fb.ok?'To\'g\'ri ✓':'To\'g\'ri javob shu'}<br><button data-a="say" data-t="${esc(w.ar)}" style="margin-top:8px">🔊</button></div>`:`<button class="pri full" data-a="wcheck">Tekshirish</button>`}`;
  }
  return head+`<div style="margin-top:14px">${body}</div>${fb?`<button class="pri full" data-a="next" style="margin-top:6px">Keyingisi →</button>`:''}`;
}

/* ---------- Video ---------- */
function vVideo(){
  return `<h1>Videolar</h1><p class="m">O'zingiz topgan dars havolalarini (YouTube va boshqalar) shu yerga mavzu bo'yicha saqlang. Bosilganda tashqarida ochiladi.</p>
  <div class="card"><input type="text" id="vt" placeholder="Nomi (masalan: Harflar 1-dars)"><input type="text" id="vu" placeholder="Havola (https://...)"><button class="full pri" data-a="addv">Saqlash</button></div>
  ${S.videos.length?S.videos.map((v,i)=>`<div class="card row"><a class="sp" style="color:var(--gold);text-decoration:none" href="${esc(v.u)}" target="_blank" rel="noopener">▶ ${esc(v.t)}</a><button data-a="delv" data-i="${i}">✕</button></div>`).join(''):`<p class="m ctr">Hozircha havola yo'q.</p>`}`;
}

/* ---------- hodisalar ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(e.target.id=='modal'){$('#modal').classList.remove('on');render()}return}
  const a=t.dataset.a,d=t.dataset;
  switch(a){
    case 'tab':T=d.t;L=null;P=null;M=null;TS=null;HL=null;render();window.scrollTo(0,0);break;
    case 'twopen':TS='words';render();window.scrollTo(0,0);break;
    case 'tback':TS=null;render();break;
    case 'tstart':{const ws=todayWords().filter(w=>!S.cards[w.id]||S.cards[w.id].due<=dk());
      const due=allWords().filter(w=>S.cards[w.id]&&S.cards[w.id].due<=dk()&&!ws.some(x=>x.id==w.id));
      L={q:[...ws,...due],flip:false,back:'today'};T='words';render();window.scrollTo(0,0);break}
    case 'seg':LS=d.s;HL=null;render();break;
    case 'hopen':HL=+d.i;render();window.scrollTo(0,0);break;
    case 'hback':HL=null;render();break;
    case 'hdone':{const id=HK[HL].id;S.hl[id]=!S.hl[id];if(S.hl[id]){const x=day();x.h=(x.h||0)+1}save();render();break}
    case 'let':openLetter(+d.i);break;
    case 'say':speak(d.t);break;
    case 'known':{const c=LET[+d.i][0];S.letters[c]=!S.letters[c];save();openLetter(+d.i);break}
    case 'close':$('#modal').classList.remove('on');render();break;
    case 'cstart':L={q:queue(),flip:false};render();break;
    case 'cend':{const b=L&&L.back;L=null;if(b)T=b;render();break}
    case 'flip':L.flip=true;render();speak(L.q[0].ar);break;
    case 'rate':rate(+d.r);render();break;
    case 'addw':{const ar=$('#nar').value.trim(),tr=$('#ntr').value.trim(),uz=$('#nuz').value.trim();
      if(!ar||!uz){toast('Arabcha va o\'zbekcha qismini yozing');break}
      S.custom.push({ar,tr:tr||'—',uz});save();toast('Qo\'shildi ✓');render();break}
    case 'pstart':startP(d.m);render();if(P.mode=='listen')speak(P.w.ar);break;
    case 'pend':P=null;M=null;render();break;
    case 'ans':{if(P.fb)break;const ok=P.opts[+d.i].id==P.w.id;if(ok)P.score++;P.fb={ok,i:+d.i};render();speak(P.w.ar);break}
    case 'wcheck':{const v=$('#wi').value;if(!v.trim())break;const ok=norm(v)==norm(P.w.ar);if(ok)P.score++;P.fb={ok};render();speak(P.w.ar);break}
    case 'next':P.n++;if(P.n<P.total)nextQ();render();if(P.mode=='listen'&&P.n<P.total)speak(P.w.ar);break;
    case 'ma':if(M.dn.includes(d.id))break;M.sa=d.id;chk();break;
    case 'mu':if(M.dn.includes(d.id))break;M.su=d.id;chk();break;
    case 'bk':{const t=$('#bkt');t.value=JSON.stringify(S);t.focus();t.select();
      try{navigator.clipboard.writeText(t.value).then(()=>toast('Nusxa olindi. Uni xavfsiz joyga saqlang.'),()=>toast('Matnni belgilab, qo\'lda nusxalang.'))}catch(e){toast('Matnni belgilab, qo\'lda nusxalang.')}break}
    case 'rs':{const t=$('#bkt').value.trim();if(!t){toast('Avval nusxani shu yerga qo\'ying');break}
      try{const o=JSON.parse(t);if(!o||typeof o!='object'||!o.cards||!o.days)throw 0;
        S=Object.assign({cards:{},letters:{},days:{},custom:[],videos:[],vflag:0,hl:{}},o);save();toast('Tiklandi ✓');render()}
      catch(e){toast('Bu to\'g\'ri zaxira nusxa emas')}break}
    case 'addv':{const tt=$('#vt').value.trim(),u=$('#vu').value.trim();
      if(!tt||!/^https?:\/\//i.test(u)){toast('Nomi va https:// bilan boshlanadigan havola kerak');break}
      S.videos.push({t:tt,u});save();render();break}
    case 'delv':S.videos.splice(+d.i,1);save();render();break;
  }
});
function chk(){
  if(M.sa&&M.su){
    if(M.sa==M.su){M.dn.push(M.sa);const w=M.ws.find(x=>x.id==M.sa);speak(w.ar)}
    else toast('Mos emas, yana urinib ko\'ring');
    M.sa=null;M.su=null;
  }
  render();
}
render();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
